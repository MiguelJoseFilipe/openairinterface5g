# SPDX-License-Identifier: LicenseRef-CSSL-1.0
#
# NOVA non-terrestrial gNB: band 66 FDD, 106 PRB at 30 kHz, USRP X310, over the air.
#
# Regenerative LEO payload (gNB on board the satellite). tx_rf() applies the Doppler
# shift of the pass and, if enabled, the propagation delay; rx_rf() delays the uplink
# by the same amount; SIB19 carries the matching ephemeris. The emulation parameters
# are in config.txt, mounted at /opt/oai-gnb/etc/config.txt (tools/ntn_doppler).
#
# FDD: in TDD the delayed downlink would overlap the uplink reception window once the
# delay exceeds the guard period.
#
# Carrier layout (must agree with "Carrier frequency" in config.txt):
#   DL pointA 430002 -> 2150.01 MHz, center 2150.01 + 106*12*30k/2 = 2169.09 MHz
#   UL pointA 350002 -> 1750.01 MHz, center                         = 1769.09 MHz
#   duplex spacing -400 MHz
# At 2169.09 MHz the Doppler reaches +-42.11 kHz, with a slope of up to 595 Hz/s.

Active_gNBs = ( "gNB-NTN");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

# Thread layout for the container cpuset of docker-compose.yaml (physical cores of
# NUMA node 0): thread pool 4-10, L1 RX 18, L1 TX 20, RU 22-28. Cores 12, 14, 16, 30,
# 32 and 34 stay free for the UHD threads, which are not pinned.
thread-pool = "4,6,8,10";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

    gNB_name  =  "gNB-NTN";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;

    plmn_list = ({
                  mcc = 001;
                  mnc = 01;
                  mnc_length = 2;
                  snssaiList = (
                                {
                                  sst = 1;
                                  sd  = 0x000001; // 0 false, else true
                                }
                               );

                 });

    nr_cellid = 12345678L

    ////////// Physical parameters:

    min_rxtxtime                                              = 6;
    do_SRS                                                    = 0;

    # NTN: SIB19 carries the satellite ephemeris and is generated by the DU.
    # Without du_sibs the SIB19 payload is never scheduled on BCCH.
    cu_sibs = [2];
    du_sibs = [19];

    # A 4.2 ... 7.2 ms round trip does not fit in 16 HARQ processes at mu=1.
    num_dlharq = 32;
    num_ulharq = 32;

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;

# downlinkConfigCommon
    #frequencyInfoDL
      # this is 2169.09 MHz
      absoluteFrequencySSB                                          = 432990;
      dl_frequencyBand                                              = 66;
      # this is 2150.01 MHz
      dl_absoluteFrequencyPointA                                    = 430002;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                           = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                        = 1;
        dl_carrierBandwidth                                         = 106;
     #initialDownlinkBWP
      #genericParameters
        initialDLBWPlocationAndBandwidth                            = 28875;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                               = 1;
      #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero                          = 12;
        initialDLBWPsearchSpaceZero                                 = 0;

  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                              = 66;
      # this is 1750.01 MHz
      ul_absoluteFrequencyPointA                                    = 350002;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                             = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      pMax                                                          = 20;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                            = 28875;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                               = 1;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 98;
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 13;
          preambleReceivedTargetPower                               = -118;
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 6;
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 1;
#ra_ReponseWindow
#1,2,4,8,10,20,40,80
        #ra_ResponseWindow                                          = 4;
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
#oneHalf (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 2;
        prach_RootSequenceIndex                                     = 1;
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        msg1_SubcarrierSpacing                                      = 1,
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0,
        msg3_DeltaPreamble                                          = 1;
        p0_NominalWithGrant                                         =-90;

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0;
        hoppingId                                                   = 40;
        p0_nominal                                                  = -90;

  # ssb_PositionsInBurs_BitmapPR
  # 1=short, 2=medium, 3=long
      ssb_PositionsInBurst_Bitmap                                   = 1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2;

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 1;

# band 66 is FDD, so there is no tdd-UL-DL-ConfigurationCommon here.
# OAI derives the duplex mode from the band (get_frame_type), never from the
# presence of a TDD block, so any pattern left in this file would be ignored.

      ssPBCH_BlockPower                                             = -25;

# ntn-Config-r17
# Regenerative payload: the gNB is on board the satellite, so there is no
# feeder link and ta-Common is 0. The UE derives the whole service-link
# timing advance from the ephemeris below plus its own configured position.
# These values are the t=0 (maximum elevation) state; the Doppler module
# overwrites them periodically ("SIB19 period" in config.txt). They must still
# be present here, otherwise gnb_config.c frees ntn_Config_r17 at startup.
# Koffset is in slots of 15 kHz SCS (i.e. ms) and has to cover the worst-case
# round trip, 7.2 ms at the edge of the visibility window.
      ntn-UlSyncValidityDuration-r17                                = 5;
      cellSpecificKoffset_r17                                       = 10;
      ta-Common-r17                                                 = 0;
      positionX-r17                                                 = 167039;
      positionY-r17                                                 = 0;
      positionZ-r17                                                 = 5359705;
      velocityVX-r17                                                = 0;
      velocityVY-r17                                                = 126029;
      velocityVZ-r17                                                = 0;
  }

  );

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

        NETWORK_INTERFACES :
        {

           GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.70.129/26";
           GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.70.129/26";
           GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
        };

  }
);

MACRLCs = (
{
  num_cc           = 1;
  tr_s_preference  = "local_L1";
  tr_n_preference  = "local_RRC";
  pusch_TargetSNRx10 = 200;
  pucch_TargetSNRx10 = 200;
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  # dB x10 above the PRACH noise estimate (default 120). The UL carrier (1769 MHz) lies in
  # the LTE band 3 uplink: 250 rejects preambles falsely detected in commercial UE traffic.
  prach_dtx_threshold = 250;
  L1_rx_thread_core = 18;
  L1_tx_thread_core = 20;
  L1_num_tx_sym_per_thread = 2;
}
);

RUs = (
{
  local_rf       = "yes"
  nb_tx          = 1
  nb_rx          = 1
  att_tx         = 0
  att_rx         = 0;
  bands          = [66];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 100;
  eNB_instances  = [0];
  sf_extension = 0
  sl_ahead = 6;
  num_tp_cores = 4;
  tp_cores = [22,24,26,28];
  # ru_thread not pinned: UHD helper threads inherit its affinity and deadlock
  sdr_addrs = "addr=192.168.30.2,clock_source=internal,time_source=internal"
}
);

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="info";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
};
