# SPDX-License-Identifier: LicenseRef-CSSL-1.0
#
# NOVA terrestrial gNB: band n78, 51 PRB (20 MHz) at 30 kHz, 2x2 MIMO, USRP X310,
# sampled at 23.04 MHz (gNB started with -E, see docker-compose.yaml).
#
# Thread layout for the container cpuset of docker-compose.yaml (physical cores of NUMA
# node 0, NIC interrupts on cores 0 and 2): thread pool 4-10, L1 RX 18, L1 TX 20, RU 22-28.
# Cores 12, 14, 16, 30, 32 and 34 stay free for the UHD threads, which are not pinned:
# pinning ru_thread makes the UHD helper threads inherit its affinity and deadlock.
thread-pool = "4,6,8,10";

Active_gNBs = ( "gNB-OAI");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

    gNB_name  =  "gNB-OAI";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;

    plmn_list = ({
                  mcc = 001;
                  mnc = 01;
                  mnc_length = 2;
                  snssaiList = (
                                {
                                  sst = 1;
                                  sd  = 0x000001; // 0 false, else true
                                }
                               );

                 });

    nr_cellid = 12345678L

    ////////// Physical parameters:

    # 2x2 MIMO: ports on X310 daughterboards A and B (TX on TX/RX, RX on RX2). Rank 2 needs
    # decorrelated TX antennas (cross-polarized, or one antenna rotated by 90 degrees).
    pdsch_AntennaPorts_XP = 2;
    pusch_AntennaPorts    = 2;
    # CSI-RS lets the UE report RI/PMI/CQI (needed for 2 DL layers)
    do_CSIRS              = 1;

    # PRBs at the carrier centre: without this, phones fail to attach on the X310 (5 of 5 runs each way)
    ul_prbblacklist                                           = "24,25,26,27"
    min_rxtxtime                                              = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;

      # 3319.68 MHz (SSB)
      absoluteFrequencySSB                                          = 621312;
      # 3309.06 MHz: lower edge of the carrier (51 PRB up to 3327.42 MHz)
      dl_absoluteFrequencyPointA                                     = 620604;
      dl_offstToCarrier                                              = 0;
      dl_subcarrierSpacing                                         = 1;
      dl_carrierBandwidth                                          = 51;
        # RBstart=0, L=51: 275*(51-1)+0 = 13750
        initialDLBWPlocationAndBandwidth                             = 13750;
        initialDLBWPsubcarrierSpacing                                = 1;
        initialDLBWPcontrolResourceSetZero                           = 12;
        initialDLBWPsearchSpaceZero                                  = 0;

      ul_frequencyBand                                               = 78;
      ul_offstToCarrier                                              = 0;
      ul_subcarrierSpacing                                           = 1;
      ul_carrierBandwidth                                            = 51;
      pMax                                                           = 20;
        initialULBWPlocationAndBandwidth                             = 13750;
        initialULBWPsubcarrierSpacing                                = 1;
          prach_ConfigurationIndex                                   = 98;
          prach_msg1_FDM                                             = 0;
          prach_msg1_FrequencyStart                                  = 0;
          zeroCorrelationZoneConfig                                  = 13;
          preambleReceivedTargetPower                                = -104;
          preambleTransMax                                           = 6;
        powerRampingStep                                             = 1;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                 = 4;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                    = 15;
        ra_ContentionResolutionTimer                                 = 7;
        rsrp_ThresholdSSB                                            = 19;
        prach_RootSequenceIndex_PR                                   = 2;
        prach_RootSequenceIndex                                      = 1;
        msg1_SubcarrierSpacing                                       = 1,
        restrictedSetConfig                                          = 0,
        msg3_DeltaPreamble                                           = 1;
        p0_NominalWithGrant                                          =-90;

        pucchGroupHopping                                            = 0;
        hoppingId                                                    = 40;
        p0_nominal                                                   = -70;   # OAI CI value for 2x2 (default -90)

      ssb_PositionsInBurst_Bitmap                                    = 2;
      ssb_periodicityServingCell                                     = 2;
      dmrs_TypeA_Position                                            = 0;
      subcarrierSpacing                                              = 1;

      referenceSubcarrierSpacing                                     = 1;
      dl_UL_TransmissionPeriodicity                                  = 6;
      nrofDownlinkSlots                                              = 7;
      nrofDownlinkSymbols                                            = 6;
      nrofUplinkSlots                                                = 2;
      nrofUplinkSymbols                                              = 4;

      ssPBCH_BlockPower                                              = -25;
  }
  );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

        NETWORK_INTERFACES :
        {
           GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.70.129/26";
           GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.70.129/26";
           GNB_PORT_FOR_S1U                         = 2152;
        };

    # UE radio-link-failure timers (SIB1). n310 20 (default 10): short DL fades do not
    # trigger an RRC re-establishment.
    TIMERS :
    {
        t310 = 2000;
        n310 = 20;
        t311 = 3000;
        n311 = 1;
    };
  }
);

# RLC AM t_poll_retransmit (sent to the UE). The default ms45 is shorter than a 4-round UL HARQ
# chain on this TDD pattern: the UE retransmits PDUs already received, which counts toward
# maxRetxThreshold and ends in a radio link failure. ms200 avoids it.
rlc = {
  srb = {
    t_poll_retransmit = "ms200"
  }
  drb_am = {
    t_poll_retransmit = "ms200"
  }
}

MACRLCs = (
{
  num_cc           = 1;
  tr_s_preference  = "local_L1";
  tr_n_preference  = "local_RRC";
  pusch_TargetSNRx10 = 200;
  pucch_TargetSNRx10 = 200;
  # Consecutive DTX before the gNB declares UL failure and stops scheduling the UE (default 10,
  # ~17 ms here). 1000 (~1.7 s) rides out bursty DTX; a lost UE is still released within seconds.
  pusch_FailureThres = 1000;
  pucch_FailureThres = 1000;
  # UL MCS cap for UL stability with phones (OAI NR_SA_Tutorial_COTS_UE.md)
  ul_max_mcs = 11;
}
);

# E2 agent (FlexRIC) disabled for the measurements
#e2_agent = {
#  near_ric_ip_addr = "127.0.0.1";
#  sm_dir = "/usr/local/lib/flexric/";
#};

L1s = (
{
  num_cc = 1;
  tr_n_preference = "local_mac";
  # Default 36. At 36, a UE at about -100 dBm stays under the absolute SSS floor of the nrUE
  # (SSS_METRIC_FLOOR_NR) and takes minutes to sync; 33 is not enough for all of them.
  tx_amp_backoff_dB = 30;
  prach_dtx_threshold = 120;
  # OAI CI value for 2x2 (default 100)
  pucch0_dtx_threshold = 80;
  # L1 RX and TX pipelines on dedicated cores; PDSCH layer mapping and precoding spread over the
  # thread pool, 2 symbols per job (OAI doc/tuning_and_security.md)
  L1_rx_thread_core = 18;
  L1_tx_thread_core = 20;
  L1_num_tx_sym_per_thread = 2;
  # Default 8; halves the worst-case LDPC decoding time (OAI NR_SA_Tutorial_COTS_UE.md)
  max_ldpc_iterations = 4;
}
);

RUs = (
{
  local_rf       = "yes"
  nb_tx          = 2   # 2x2
  nb_rx          = 2   # 2x2
  att_tx         = 0
  att_rx         = 0;
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 88;   # default 100 overloads the front end with p0_nominal -70
  eNB_instances  = [0];
  sf_extension = 0
  sl_ahead = 6;
  num_tp_cores = 4;
  tp_cores = [22,24,26,28];
  # ru_thread not pinned (see header): NUMA locality comes from the container cpuset
  sdr_addrs = "addr=192.168.30.2,second_addr=192.168.40.2,clock_source=internal,time_source=internal"
}
);

rfsimulator :
{
  serveraddr = "server";
  serverport = 4043;
  options = ();
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="info";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
  f1ap_log_level                        ="error";
};
